server.port=8082

spring.application.name=order-service

spring.datasource.url=jdbc:h2:mem:orderdb

spring.datasource.driver-class-name=org.h2.Driver

spring.datasource.username=sa

spring.datasource.password=password

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.h2.console.enabled=true

spring.h2.console.path=/h2-console

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.admin.auto-create=true


# =========================================================
# USER SERVICE - CIRCUIT BREAKER
# =========================================================

resilience4j.circuitbreaker.instances.userServiceCB.registerHealthIndicator=true

resilience4j.circuitbreaker.instances.userServiceCB.slidingWindowSize=10

resilience4j.circuitbreaker.instances.userServiceCB.failureRateThreshold=50

resilience4j.circuitbreaker.instances.userServiceCB.slowCallRateThreshold=50

resilience4j.circuitbreaker.instances.userServiceCB.slowCallDurationThreshold=2s

resilience4j.circuitbreaker.instances.userServiceCB.permittedNumberOfCallsInHalfOpenState=3

resilience4j.circuitbreaker.instances.userServiceCB.maxWaitDurationInHalfOpenState=5s

resilience4j.circuitbreaker.instances.userServiceCB.waitDurationInOpenState=10s

resilience4j.circuitbreaker.instances.userServiceCB.automaticTransitionFromOpenToHalfOpenEnabled=true

resilience4j.circuitbreaker.instances.userServiceCB.ignoreExceptions=com.company.order.UserNotFoundException


# =========================================================
# USER SERVICE - RETRY
# =========================================================

resilience4j.retry.instances.userServiceRetry.maxAttempts=3

resilience4j.retry.instances.userServiceRetry.waitDuration=1s

resilience4j.retry.instances.userServiceRetry.enableExponentialBackoff=true

resilience4j.retry.instances.userServiceRetry.exponentialBackoffMultiplier=2

resilience4j.retry.instances.userServiceRetry.retryExceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException,java.io.IOException

resilience4j.retry.instances.userServiceRetry.ignoreExceptions=com.company.order.UserNotFoundException


# =========================================================
# INVENTORY SERVICE - CIRCUIT BREAKER
# =========================================================

resilience4j.circuitbreaker.instances.inventoryServiceCB.registerHealthIndicator=true

resilience4j.circuitbreaker.instances.inventoryServiceCB.slidingWindowSize=10

resilience4j.circuitbreaker.instances.inventoryServiceCB.failureRateThreshold=50

resilience4j.circuitbreaker.instances.inventoryServiceCB.slowCallRateThreshold=50

resilience4j.circuitbreaker.instances.inventoryServiceCB.slowCallDurationThreshold=2s

resilience4j.circuitbreaker.instances.inventoryServiceCB.permittedNumberOfCallsInHalfOpenState=3

resilience4j.circuitbreaker.instances.inventoryServiceCB.maxWaitDurationInHalfOpenState=5s

resilience4j.circuitbreaker.instances.inventoryServiceCB.waitDurationInOpenState=10s

resilience4j.circuitbreaker.instances.inventoryServiceCB.automaticTransitionFromOpenToHalfOpenEnabled=true

resilience4j.circuitbreaker.instances.inventoryServiceCB.ignoreExceptions=com.company.order.InventoryReservationException


# =========================================================
# INVENTORY SERVICE - RETRY
# =========================================================

resilience4j.retry.instances.inventoryServiceRetry.maxAttempts=3

resilience4j.retry.instances.inventoryServiceRetry.waitDuration=1s

resilience4j.retry.instances.inventoryServiceRetry.enableExponentialBackoff=true

resilience4j.retry.instances.inventoryServiceRetry.exponentialBackoffMultiplier=2

resilience4j.retry.instances.inventoryServiceRetry.retryExceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException,java.io.IOException

resilience4j.retry.instances.inventoryServiceRetry.ignoreExceptions=com.company.order.InventoryReservationException


# =========================================================
# RESILIENCE4J LOGGING
# =========================================================

logging.level.io.github.resilience4j.retry=TRACE

logging.level.io.github.resilience4j.circuitbreaker=DEBUG